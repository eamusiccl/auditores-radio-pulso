name: Auditores Radio Pulso
on:
  schedule:
    - cron: '0 11-23,0-2 * * *'
  workflow_dispatch:

jobs:
  escuchar_radio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -u bot_pulso_nube.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STREAM_URL: ${{ secrets.STREAM_URL }}
          FIREBASE_CHAT_URL: ${{ secrets.FIREBASE_CHAT_URL }}
